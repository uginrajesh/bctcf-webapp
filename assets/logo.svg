<title>BC Tamil Catholic Family logo</title>
<desc>A gold circular seal. A ring of diverse people in blue, orange, gold and yellow hold hands around a central spiritual symbol of a white dove, golden cross, light rays and a chalice holding the Host with a flame beneath the cross. Tamil text curves across the top, English across the bottom.</desc>
